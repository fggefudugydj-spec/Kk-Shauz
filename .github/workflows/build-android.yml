name: Build Android APK

on:
  push:
    branches: [add-ai-council]
    paths: ["ai-council-android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: ai-council-android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AICouncil-android-apk
          path: ai-council-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ai-council-android/app/build/outputs/apk/debug/app-debug.apk AICouncil.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest AICouncil.apk --title "AI Council (Android)" --notes "Latest Android APK" --target "$GITHUB_SHA"
